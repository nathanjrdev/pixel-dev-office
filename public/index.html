<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escritório Pixel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra de cima com números e uso; lateral com projetos e devs; mapa no meio com feed embaixo; chat do dev abre à direita */
:root{
  --bg:#141220; --panel:#1c1930; --panel2:#24203d; --line:#302a52; --deep:#0e0c18;
  --ink:#eeeaff; --muted:#9d95c8; --dim:#6c6596;
  --mint:#7ff0c4; --peach:#ffb37a; --rose:#ff7aa8; --sun:#ffd84d; --sky:#5bc0ff; --violet:#c48bff; --danger:#ff5a76;
  --f-pixel:"Pixelify Sans", ui-monospace, monospace;
  --f-body:"Rubik", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}

/* ---- barra de cima ---- */
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);box-shadow:0 2px 0 var(--line);padding-block:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none;image-rendering:pixelated;background:var(--deep);box-shadow:0 0 0 2px var(--line)}
.brand b{font-family:var(--f-pixel);font-size:22px;line-height:1;color:var(--ink);display:block;letter-spacing:.02em}
.modo{display:inline-block;margin-top:3px;font-size:11px;font-weight:500;padding:1px 8px;border-radius:99px;background:#3a2d64;color:var(--violet)}
.modo[data-on="true"]{background:#173b2f;color:var(--mint)}
.modo[data-on="off"]{background:#4a1c2a;color:var(--danger)}
.kpis{display:flex;gap:2px;background:var(--deep);border-radius:10px;padding:3px;flex-wrap:wrap}
.kpi{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:8px;min-width:0}
.kpi b{font-family:var(--f-pixel);font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);line-height:1.1}
.kpi[data-hot="true"]{background:#3d3010}
.kpi[data-hot="true"] b{color:var(--sun)}
.spacer{flex:1}
.meters{display:flex;gap:8px;flex-wrap:wrap}
.meter{background:var(--deep);border-radius:10px;padding:6px 10px;display:grid;grid-template-columns:auto 72px auto;align-items:center;gap:4px 8px;font-size:12px;--c:var(--mint)}
.meter[data-lvl="warn"]{--c:var(--sun)}
.meter[data-lvl="bad"]{--c:var(--danger)}
.meter .k{color:var(--muted)}
.meter .bar{height:8px;background:#2a2547;border-radius:2px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--c);transition:width .5s}
.meter .v{font-family:var(--f-mono);font-weight:600;color:var(--c);font-size:12px}
.meter .r{grid-column:1/-1;color:var(--dim);font-size:11px;line-height:1.1}
.tools{display:flex;gap:8px;align-items:center}
.switch{display:flex;align-items:center;gap:8px;background:var(--deep);border:0;border-radius:10px;padding:7px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.switch i{width:30px;height:16px;border-radius:99px;background:#3a3460;position:relative;flex:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch[aria-checked="true"]{color:var(--mint)}
.switch[aria-checked="true"] i{background:#1f6b50}
.switch[aria-checked="true"] i::after{left:16px;background:var(--mint)}
.icon-btn{background:var(--deep);border:0;border-radius:10px;padding:7px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.icon-btn[aria-pressed="true"]{color:var(--mint)}

/* ---- lateral ---- */
.side{background:var(--panel);box-shadow:2px 0 0 var(--line);overflow-y:auto;padding-block:12px 20px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.side-h{display:flex;gap:8px}
.search{flex:1;min-width:0;background:var(--deep);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:8px 10px;font:inherit;font-size:14px}
.search::placeholder{color:var(--dim)}
.btn{background:var(--mint);color:#0f2a20;border:0;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.no{background:#4a1c2a;color:#ffc2cf}
.btn:disabled{opacity:.45;cursor:not-allowed}
.novo{background:var(--deep);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px var(--line)}
.novo label{font-size:12px;color:var(--muted)}
.novo input{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font:inherit;font-size:14px;min-width:0}
.novo .err{color:var(--danger);font-size:13px;margin:0}
.novo .row{display:flex;gap:8px;justify-content:flex-end}
.grp{background:var(--deep);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 3px 0 0 var(--pc,var(--line))}
.grp-h{display:flex;align-items:center;gap:8px;padding:0 4px}
.grp-h b{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-h .n{font-size:11px;background:var(--panel2);color:var(--muted);border-radius:99px;padding:0 7px}
.grp-p{font-family:var(--f-mono);font-size:11px;color:var(--dim);padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;background:transparent;border:0;border-radius:10px;padding:6px;cursor:pointer;text-align:left;width:100%}
.dev:hover{background:var(--panel)}
.dev[aria-pressed="true"]{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.dev img{width:38px;height:38px;image-rendering:pixelated;border-radius:8px;background:var(--panel2)}
.dev b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;line-height:1.2}
.dev .via{font-size:10px;font-weight:500;color:var(--muted);background:var(--panel2);border-radius:4px;padding:0 5px}
.dev .act{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.dev .act[data-s="esperando"]{color:var(--sun)}
.dev .st{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:3px;background:var(--dim)}
.dot[data-s="trabalhando"]{background:var(--mint)}
.dot[data-s="esperando"]{background:var(--sun);animation:blink 1s steps(2) infinite}
.dot[data-s="pronto"]{background:var(--rose)}
.dot[data-s="cafe"]{background:var(--peach)}
.dot[data-s="poltrona"]{background:var(--violet)}
.empty{color:var(--muted);font-size:14px;padding:4px;margin:0}

/* ---- palco ---- */
.stage{position:relative;min-height:0;background:#4f8a3e;overflow:hidden}
.mapzone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px}
.stage.com-chat .mapzone{right:min(420px,100%)}
.mapwrap{position:relative;container-type:inline-size;flex:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:pointer}
.ov{position:absolute;inset:0;pointer-events:none}
.ov>*{position:absolute;transform:translate(-50%,-50%);white-space:nowrap}
.room{font-family:var(--f-pixel);font-size:clamp(9px,2.1cqw,15px);background:#2a2547ee;color:#fff;padding:.15em .7em;border-radius:6px;box-shadow:0 2px 0 #0008}
.proj{transform:translate(0,-50%);font-size:clamp(8px,1.8cqw,13px);font-weight:600;background:#1c1930ee;color:#fff;padding:.15em .6em;border-radius:6px;display:flex;align-items:center;gap:.4em;box-shadow:inset 3px 0 0 var(--pc)}
.proj i{font-style:normal;font-size:.85em;color:var(--muted)}
.tag{font-size:clamp(7px,1.55cqw,12px);font-weight:600;background:#1c1930f0;color:#fff;padding:.1em .55em .1em .2em;border-radius:99px;display:flex;align-items:center;gap:.35em;transform:translate(-50%,0)}
.tag u{text-decoration:none;width:1.35em;height:1.35em;border-radius:50%;display:grid;place-items:center;font-size:.8em;color:#141220;background:var(--pc)}
.tag.tec{background:#3a2d64f0}
.say{font-size:clamp(7px,1.5cqw,12px);background:#fff;color:#1c1930;padding:.25em .6em;border-radius:7px;box-shadow:0 2px 0 #0004;transform:translate(-50%,-100%);max-width:42cqw;overflow:hidden;text-overflow:ellipsis}
.say::after{content:"";position:absolute;left:50%;bottom:-.35em;width:.7em;height:.7em;background:inherit;transform:translateX(-50%) rotate(45deg)}
.say[data-s="esperando"]{background:var(--sun);font-weight:600}

/* ---- feed ---- */
.feed{position:absolute;left:14px;bottom:14px;width:min(620px,calc(100% - 28px));background:#1c1930f2;border-radius:12px;box-shadow:0 0 0 1px var(--line),0 8px 24px #0006;max-height:min(38%,190px);display:flex;flex-direction:column;min-height:0;z-index:1}
.feed-h{display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:8px 12px;cursor:pointer;font-family:var(--f-pixel);font-size:15px}
.feed-h span{color:var(--muted);font-family:var(--f-body);font-size:12px}
.feed ol{list-style:none;margin:0;padding:0 12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
.feed li{display:grid;grid-template-columns:62px 22px minmax(70px,140px) minmax(0,1fr);gap:8px;align-items:center;font-size:13px}
.feed li time{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.feed li img{width:22px;height:22px;image-rendering:pixelated;border-radius:5px;background:var(--panel2)}
.feed li b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed li span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed li span em{font-style:normal;font-size:11px;padding:0 6px;border-radius:4px;margin-right:6px;color:#141220;background:var(--pc)}
.feed[data-open="false"] ol{display:none}

/* ---- chat do dev ---- */
.chat{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);box-shadow:-2px 0 0 var(--line),-12px 0 30px #0006;display:flex;flex-direction:column;z-index:2}
.ch-h{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.ch-h img{width:44px;height:44px;image-rendering:pixelated;border-radius:10px;background:var(--panel2)}
.ch-h b{font-family:var(--f-pixel);font-size:19px;display:block;line-height:1.1}
.ch-h small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-h .x{background:var(--panel2);border:0;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px}
.ch-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--ink)}
.chip[data-s="trabalhando"]{background:#173b2f;color:var(--mint)}
.chip[data-s="esperando"]{background:#4a3c10;color:var(--sun)}
.chip[data-s="pronto"]{background:#4a1c35;color:var(--rose)}
.chip[data-s="cafe"],.chip[data-s="poltrona"]{background:#3d2a17;color:var(--peach)}
.ch-bar .sp{flex:1}
.mini{background:var(--panel2);border:0;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
.mini.no{background:#4a1c2a;color:#ffc2cf}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m-voce{align-self:flex-end;max-width:85%;background:#2f5bd1;color:#fff;padding:8px 12px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.m-claude{align-self:stretch;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.m-claude>i{width:22px;height:22px;border-radius:6px;background:#d97757;display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;margin-top:2px}
.md{min-width:0;overflow-wrap:anywhere}
.md p{margin:0 0 .6em}.md p:last-child{margin:0}
.md ul,.md ol{margin:0 0 .6em;padding-left:1.3em}
.md li{margin:.15em 0}
.md code{font-family:var(--f-mono);font-size:.86em;background:var(--deep);padding:.05em .35em;border-radius:4px;color:var(--peach)}
.md pre{background:var(--deep);border-radius:8px;padding:10px;overflow-x:auto;margin:0 0 .6em}
.md pre code{background:none;padding:0;color:var(--ink);font-size:12.5px}
.md h4{font-size:1em;margin:.4em 0 .3em}
.md a{color:var(--sky)}
.m-ferr{display:flex;flex-direction:column;gap:2px;padding-left:30px}
.m-ferr div{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:baseline;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-ferr div span{font-family:var(--f-mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.m-perm{margin-left:30px;background:#3a3010;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px #6b5717}
.m-perm b{font-size:13px;color:var(--sun)}
.m-perm code{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.m-perm small{color:#ffcf8f}
.m-perm .row{display:flex;gap:8px}
.m-perm[data-ok="true"]{background:#173b2f;box-shadow:none}
.m-perm[data-ok="false"]{background:#3a1c26;box-shadow:none}
.m-fim{align-self:center;font-size:11px;color:var(--dim);background:var(--deep);border-radius:99px;padding:2px 10px}
.m-erro{margin-left:30px;font-size:13px;color:#ffc2cf;background:#3a1c26;border-radius:10px;padding:8px 10px}
.m-nota{align-self:center;text-align:center;font-size:12.5px;color:var(--muted);max-width:32ch}
.caret{display:inline-block;width:.5em;height:1em;background:var(--mint);vertical-align:-2px;animation:blink 1s steps(2) infinite}
.ch-f{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{background:var(--panel2);border:0;border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{flex:1;min-width:0;resize:none;background:var(--deep);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:9px 10px;font:inherit;font-size:14px;max-height:140px}
.ask textarea::placeholder{color:var(--dim)}
.ch-f .note{font-size:12.5px;color:var(--muted);margin:0}
.tec-info{padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.tec-info p{margin:0;color:var(--muted)}
.tec-info ol{margin:0;padding-left:1.2em;font-size:13px;color:var(--muted)}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot[data-s="esperando"],.caret{animation:none}}

/* ---- celular ---- */
@media (max-width:860px){
  .app{display:flex;flex-direction:column;height:auto;min-height:100dvh}
  .kpis{order:5;width:100%}
  .meters{width:100%}
  .meter{flex:1;grid-template-columns:auto minmax(40px,1fr) auto}
  .stage{order:1;overflow:visible}
  .mapzone{position:static;padding:8px}
  .stage.com-chat .mapzone{right:auto}
  .mapwrap{width:100%!important;height:auto!important;aspect-ratio:440/356}
  .feed{position:static;width:auto;margin:0 8px 8px;max-height:none}
  .feed ol{max-height:220px}
  .side{order:2;box-shadow:none;overflow:visible;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .chat{position:fixed;inset:0;width:100%;z-index:20;padding-top:env(safe-area-inset-top,0px)}
  .feed li{grid-template-columns:56px 22px minmax(0,90px) minmax(0,1fr)}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><canvas class="logo" id="logo" width="17" height="17" aria-hidden="true"></canvas><div><b>Escritório Pixel</b><span class="modo" id="modo">Simulação</span></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="spacer"></div>
    <div class="meters">
      <div class="meter" id="m5"><span class="k">5h</span><div class="bar"><i></i></div><span class="v">—</span><span class="r">—</span></div>
      <div class="meter" id="mS"><span class="k">Semana</span><div class="bar"><i></i></div><span class="v">—</span><span class="r">—</span></div>
      <div class="meter" id="mG"><span class="k">Hoje</span><span class="v" style="grid-column:2/-1">—</span><span class="r">tokens gastos</span></div>
    </div>
    <div class="tools">
      <button class="switch" id="livre" type="button" role="switch" aria-checked="false" title="Com o modo livre, os devs não pedem permissão (comandos arriscados ainda perguntam)"><i></i>Modo livre</button>
      <button class="icon-btn" id="som" type="button" aria-pressed="false">Som</button>
    </div>
  </header>

  <aside class="side" aria-label="Projetos e devs">
    <div class="side-h"><input class="search" id="busca" type="search" placeholder="Buscar dev ou projeto" autocomplete="off"><button class="btn" id="novo" type="button">+ Dev</button></div>
    <form class="novo" id="fNovo" hidden>
      <label for="pasta">Pasta do projeto onde o novo dev vai trabalhar</label>
      <input id="pasta" list="pastas" placeholder="C:\Users\voce\Desktop\vivacare" autocomplete="off">
      <datalist id="pastas"></datalist>
      <p class="err" id="novoErr" hidden></p>
      <div class="row"><button class="btn ghost" type="button" id="novoX">Cancelar</button><button class="btn" type="submit">Contratar</button></div>
    </form>
    <div id="lista"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="mapzone" id="mapzone"><div class="mapwrap" id="mapwrap"><canvas id="sala" width="440" height="356" aria-label="Mapa do escritório com os devs"></canvas><div class="ov" id="ov"></div></div></div>
    <section class="feed" id="feed" data-open="true" aria-label="Atividade">
      <button class="feed-h" id="feedT" type="button" aria-expanded="true">Atividade <span id="feedN"></span></button>
      <ol id="feedL"></ol>
    </section>
    <aside class="chat" id="chat" hidden aria-label="Conversa com o dev">
      <div class="ch-h"><img id="cAv" alt=""><div><b id="cNome"></b><small id="cSub"></small></div><button class="x" id="cX" type="button" aria-label="Fechar">×</button></div>
      <div class="ch-bar"><span class="chip" id="cChip"></span><span id="cMeta"></span><span class="sp"></span><button class="mini no" id="cParar" type="button" hidden>Parar</button><button class="mini" id="cDisp" type="button" hidden>Dispensar</button></div>
      <div class="msgs" id="msgs"></div>
      <div class="tec-info" id="tecInfo" hidden></div>
      <form class="ch-f" id="fMsg">
        <div class="quick" id="quick"><button type="button" data-q="Explique este projeto em poucas linhas.">Explique o projeto</button><button type="button" data-q="Rode os testes e me diga o resultado.">Rodar testes</button><button type="button" data-q="/handoff">/handoff</button></div>
        <div class="ask"><textarea id="txt" rows="2" placeholder="Mande uma ordem ou pergunta…"></textarea><button class="btn" id="enviar" type="submit">Enviar</button></div>
        <p class="note" id="cNota" hidden></p>
      </form>
    </aside>
  </main>
</div>

<script>
(()=>{
const cv=document.getElementById('sala');let cx=cv.getContext('2d');
const W=400,H=300,OUT='#1b1530';
function R(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h);}
function shade(h,k){const n=parseInt(h.slice(1),16);const c=v=>Math.max(0,Math.min(255,Math.round(v*k))).toString(16).padStart(2,'0');return '#'+c(n>>16)+c(n>>8&255)+c(n&255);}

function apply(a){
  const s=a.srv,moving=a.path.length>0;
  if(s==='trabalhando'||s==='esperando'){
    if(moving){if(a.goingSeat)a.after=s;else goSeat(a,s);}
    else if(atSeat(a))a.state=s;

function freeSpot(){
  const used=agents.map(a=>a.spot).filter(s=>s!=null);
  const free=SPOTS.map((s,i)=>i).filter(i=>!used.includes(i));
  if(!free.length)return 6;
  const partner=[0,1].find(i=>used.includes(i)), other=partner===0?1:0;
  if(partner!=null&&free.includes(other)&&Math.random()<.6)return other;
  const bp=[7,8].find(i=>used.includes(i)),bo=bp===7?8:7;
  if(bp!=null&&free.includes(bo)&&Math.random()<.6)return bo;
  return free[Math.floor(Math.random()*free.length)];
}

const POOL={x0:298,x1:352,y0:100,y1:122};
const POCKETS=[[297,99],[352,99],[297,122],[352,122],[324,98],[324,123]];
const BALLC=['#ffffff','#ffd84d','#5bc0ff','#ff4d6d','#c48bff','#ff9f6e','#3fa86b','#1b1530'];
let balls=[],poolT=0,shooterIdx=0,windup=null,rackT=0,lastShooter=null,poolLast=null;
function rack(){balls=[{x:310,y:110,vx:0,vy:0,c:0,in:false}];const order=[1,3,2,7,4,6,5];let k=0;
  for(let col=0;col<4&&k<7;col++)for(let r=0;r<=col&&k<7;r++)balls.push({x:334+col*3,y:110-col*1.5+r*3,vx:0,vy:0,c:order[k++],in:false});}
rack();
function poolPlayers(){return agents.filter(a=>actOf(a)==='sinuca');}
function shoot(a){
  lastShooter=a;const cue=balls[0];if(cue.in)return;
  const targets=balls.filter(b=>!b.in&&b.c!==0);if(!targets.length)return;
  const t=targets[Math.floor(Math.random()*targets.length)];
  const ang=Math.atan2(t.y-cue.y,t.x-cue.x)+(Math.random()-.5)*.15,sp=95+Math.random()*45;
  cue.vx=Math.cos(ang)*sp;cue.vy=Math.sin(ang)*sp;
}
function poolStep(dt){
  const live=balls.filter(b=>!b.in);let moving=false;
  for(const b of live){
    b.x+=b.vx*dt;b.y+=b.vy*dt;const f=Math.pow(.25,dt);b.vx*=f;b.vy*=f;
    if(Math.hypot(b.vx,b.vy)<3){b.vx=0;b.vy=0;}else moving=true;
    if(b.x<POOL.x0){b.x=POOL.x0;b.vx=Math.abs(b.vx);}if(b.x>POOL.x1){b.x=POOL.x1;b.vx=-Math.abs(b.vx);}
    if(b.y<POOL.y0){b.y=POOL.y0;b.vy=Math.abs(b.vy);}if(b.y>POOL.y1){b.y=POOL.y1;b.vy=-Math.abs(b.vy);}
    for(const p of POCKETS)if(Math.hypot(b.x-p[0]-.5,b.y-p[1]-.5)<3){b.in=true;b.vx=b.vy=0;if(b.c!==0&&lastShooter)lastShooter.cheer=2;break;}
  }
  for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){
    const p=live[i],q=live[j];if(p.in||q.in)continue;
    const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
    if(d>0&&d<2.4){const nx=dx/d,ny=dy/d,v=(p.vx-q.vx)*nx+(p.vy-q.vy)*ny;
      if(v>0){p.vx-=v*nx;p.vy-=v*ny;q.vx+=v*nx;q.vy+=v*ny;}
      const o=(2.4-d)/2;p.x-=nx*o;p.y-=ny*o;q.x+=nx*o;q.y+=ny*o;}
  }
  const players=poolPlayers();
  agents.forEach(p=>{if(p.cheer>0)p.cheer-=dt;});
  const cue=balls[0];
  if(cue.in&&!moving){cue.in=false;cue.x=310;cue.y=110;}
  if(balls.slice(1).every(b=>b.in)){rackT+=dt;if(rackT>2.5){rack();rackT=0;}return;}
  if(!players.length){windup=null;return;}
  if(windup){if(!players.includes(windup.a)){windup=null;return;}windup.t-=dt;if(windup.t<=0){shoot(windup.a);windup=null;}return;}
  if(moving)return;
  poolT+=dt;
  if(poolT>2){poolT=0;shooterIdx=(shooterIdx+1)%players.length;windup={a:players[shooterIdx],t:.6};}
}

function corProjeto(p){let h=0;for(const c of String(p))h=(h*31+c.charCodeAt(0))>>>0;return PCORES[h%PCORES.length];}
function icone(t){t=String(t||'');
  if(/^Lendo/.test(t))return '📖';if(/^(Editando|Criando)/.test(t))return '✏️';if(/^Rodando/.test(t))return '▶️';
  if(/^(Procurando|Pesquisando)/.test(t))return '🔎';if(/^Abrindo/.test(t))return '🌐';if(/^Chamou|Técnico/.test(t))return '👥';
  if(/^✋|^⚠/.test(t))return '';if(/^Nova tarefa/.test(t))return '📨';return '•';}
function acaoDe(a){
  const s=a.s||{};
  if(s.estado==='esperando')return {txt:'✋ Precisa de você',s:'esperando'};

/* markdown simples para as respostas do Claude */
function md(src){
  const blocos=[];let txt=String(src||'').replace(/```[^\n]*\n([\s\S]*?)(```|$)/g,(_,c)=>{blocos.push('<pre><code>'+esc(c.replace(/\n$/,''))+'</code></pre>');return '\u0000'+(blocos.length-1)+'\u0000';});
  const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return txt.split(/\n{2,}/).map(par=>{
    const m=par.match(/^\u0000(\d+)\u0000$/);if(m)return blocos[+m[1]];
    const ls=par.split('\n');
    if(ls.every(l=>/^\s*[-*•]\s+/.test(l)))return '<ul>'+ls.map(l=>'<li>'+inl(l.replace(/^\s*[-*•]\s+/,''))+'</li>').join('')+'</ul>';
    if(ls.every(l=>/^\s*\d+[.)]\s+/.test(l)))return '<ol>'+ls.map(l=>'<li>'+inl(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>').join('')+'</ol>';
    if(/^#{1,4}\s/.test(par))return '<h4>'+inl(par.replace(/^#{1,4}\s+/,''))+'</h4>';
    return '<p>'+ls.map(inl).join('<br>').replace(/\u0000(\d+)\u0000/g,(_,i)=>blocos[+i])+'</p>';
  }).join('');
}
